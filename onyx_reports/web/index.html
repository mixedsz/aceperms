<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Onyx Reports</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════════
       USER  ·  REPORT SUBMISSION MODAL
  ════════════════════════════════════════════════ -->
  <div id="user-overlay" class="overlay hidden">
    <div id="user-modal" class="modal">

      <div class="modal-header">
        <div class="modal-title-wrap">
          <div class="modal-icon">
            <!-- flag icon -->
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
              <line x1="4" y1="22" x2="4" y2="15"/>
            </svg>
          </div>
          <div>
            <h2 class="modal-title">Submit a Report</h2>
            <p class="modal-sub">Our staff team will assist you shortly</p>
          </div>
        </div>
        <button class="icon-btn" id="close-user-modal" title="Close">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <div class="modal-body">

        <!-- Category dropdown -->
        <div class="field-group">
          <label class="field-label">Report Category <span class="req">*</span></label>
          <div class="c-select" id="cat-select">
            <div class="c-select__trigger" id="cat-trigger">
              <span class="c-select__placeholder" id="cat-placeholder">Choose a category…</span>
              <svg class="c-select__arrow" xmlns="http://www.w3.org/2000/svg" width="15" height="15"
                   viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                   stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </div>
            <div class="c-select__dropdown hidden" id="cat-dropdown">
              <!-- populated by JS -->
            </div>
          </div>
        </div>

        <!-- Player/target field — shown only for certain categories -->
        <div class="field-group hidden" id="player-field">
          <label class="field-label">
            Player Name / Server ID
            <span class="field-hint">(optional)</span>
          </label>
          <input class="field-input" id="player-input"
                 type="text" placeholder="e.g. John Doe or #42" maxlength="60" />
        </div>

        <!-- Description -->
        <div class="field-group">
          <label class="field-label">Description <span class="req">*</span></label>
          <textarea class="field-textarea" id="report-desc"
                    placeholder="Describe your issue in detail. The more context you provide, the faster we can help…"
                    maxlength="500"></textarea>
          <div class="char-row">
            <span id="char-count">0</span>&thinsp;/&thinsp;500
          </div>
        </div>

      </div>

      <div class="modal-footer">
        <button class="btn btn-ghost" id="cancel-report">Cancel</button>
        <button class="btn btn-primary" id="submit-report" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
          Submit Report
        </button>
      </div>

    </div>
  </div>


  <!-- ═══════════════════════════════════════════════
       ADMIN  ·  REPORT MANAGEMENT PANEL
  ════════════════════════════════════════════════ -->
  <div id="admin-panel" class="admin-panel hidden">

    <!-- ── Sidebar ────────────────────────────── -->
    <aside class="a-sidebar">

      <div class="a-sidebar__head">
        <div class="a-logo">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
          <span>Onyx Reports</span>
        </div>
        <button class="icon-btn" id="close-admin" title="Close">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- Filters -->
      <div class="a-filters">
        <button class="a-filter active" data-filter="all">All</button>
        <button class="a-filter" data-filter="open">Open</button>
        <button class="a-filter" data-filter="active">Active</button>
        <button class="a-filter" data-filter="closed">Closed</button>
      </div>

      <div class="a-count" id="a-count">Loading…</div>

      <!-- Report list -->
      <div class="a-list" id="a-list">
        <!-- populated by JS -->
      </div>

    </aside>

    <!-- ── Detail pane ────────────────────────── -->
    <section class="a-detail" id="a-detail">

      <!-- Empty state -->
      <div class="a-empty" id="a-empty">
        <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="1.4"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <h3>No report selected</h3>
        <p>Click a report on the left to view its details</p>
      </div>

      <!-- Detail content -->
      <div class="a-content hidden" id="a-content">

        <div class="a-content__head">
          <div>
            <div class="detail-id"  id="d-id"></div>
            <div class="detail-cat" id="d-cat"></div>
            <div class="detail-meta" id="d-meta"></div>
          </div>
          <div class="badge" id="d-badge"></div>
        </div>

        <div class="a-content__body" id="a-body">

          <!-- Reporter -->
          <div class="d-section">
            <div class="d-section__label">Reporter</div>
            <div class="reporter-card" id="d-reporter"></div>
          </div>

          <!-- Description -->
          <div class="d-section">
            <div class="d-section__label">Description</div>
            <div class="desc-box" id="d-desc"></div>
          </div>

          <!-- Messages -->
          <div class="d-section">
            <div class="d-section__label">Staff Messages</div>
            <div class="msg-list" id="d-msgs">
              <span class="msg-empty">No messages yet</span>
            </div>
            <div class="msg-composer" id="d-composer">
              <input class="msg-input" id="msg-input"
                     type="text" placeholder="Message the reporter…" maxlength="200" />
              <button class="btn btn-primary btn-sm" id="send-msg-btn" title="Send">
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2.5"
                     stroke-linecap="round" stroke-linejoin="round">
                  <line x1="22" y1="2" x2="11" y2="13"/>
                  <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
              </button>
            </div>
          </div>

        </div>

        <!-- Actions -->
        <div class="a-actions" id="a-actions">
          <button class="btn btn-success" id="btn-handle">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
              <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            Handle
          </button>
          <button class="btn btn-danger" id="btn-close-report">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="15" y1="9" x2="9" y2="15"/>
              <line x1="9" y1="9" x2="15" y2="15"/>
            </svg>
            Close Report
          </button>
        </div>

      </div>
    </section>

  </div>


  <!-- ═══════════════════════════════════════════════
       CLOSE REASON  ·  MINI MODAL
  ════════════════════════════════════════════════ -->
  <div id="reason-overlay" class="overlay hidden">
    <div class="modal modal-sm">

      <div class="modal-header">
        <div class="modal-title-wrap">
          <div class="modal-icon modal-icon--danger">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="15" y1="9" x2="9" y2="15"/>
              <line x1="9" y1="9" x2="15" y2="15"/>
            </svg>
          </div>
          <div>
            <h2 class="modal-title">Close Report</h2>
            <p class="modal-sub">Provide a closing reason for the reporter</p>
          </div>
        </div>
        <button class="icon-btn" id="close-reason-modal" title="Cancel">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <div class="modal-body">
        <div class="field-group">
          <label class="field-label">Closing Reason</label>
          <textarea class="field-textarea field-textarea--sm" id="close-reason"
                    placeholder="e.g. Resolved in-game, Duplicate report, Not enough information…"
                    maxlength="200"></textarea>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-ghost" id="cancel-close">Cancel</button>
        <button class="btn btn-danger" id="confirm-close">Close Report</button>
      </div>

    </div>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
